<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Surgical Instrument Detection — Tool</title>
<script>
  (function () {
    var pref = localStorage.getItem("theme_preference");
    if (pref === "dark" || pref === "light") {
      document.documentElement.setAttribute("data-theme", pref);
    }
  })();
</script>
<link rel="stylesheet" href="/style.css" />
</head>
<body>

<div class="topnav">
  <div class="tabs">
    <button class="tab active" data-tab="extract">Extract</button>
    <button class="tab" data-tab="detect" disabled title="Coming soon">Detect</button>
    <button class="tab" data-tab="annotate" disabled title="Coming soon">Annotate</button>
    <button class="tab" data-tab="export" disabled title="Coming soon">Export</button>
  </div>
  <div style="display:flex; align-items:center; gap:8px;">
    <button id="theme-btn" class="icon-btn" title="Appearance">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>
    </button>
  </div>
  <div id="theme-popover" class="theme-popover">
    <button data-theme-choice="system">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
      Follow system settings
    </button>
    <button data-theme-choice="dark">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      Dark mode
    </button>
    <button data-theme-choice="light">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
      Light mode
    </button>
  </div>
</div>

<main>

  <section id="extract-section">

    <div class="card">
      <h2 style="margin-top:0;">Videos</h2>
      <input class="input" type="file" id="video-file-input" accept=".mp4,.avi,.mov,.mkv,.wmv" multiple />
      <ul id="video-list" class="video-list"></ul>
    </div>

    <div class="card">
      <h2 style="margin-top:0;">Extract Frames</h2>

      <label>Mode</label>
      <div class="checkbox-row">
        <input type="radio" name="mode" value="target" id="mode-target" checked />
        <label for="mode-target" style="margin:0;">Adaptive (Target frame count)</label>
      </div>
      <div class="checkbox-row">
        <input type="radio" name="mode" value="interval" id="mode-interval" />
        <label for="mode-interval" style="margin:0;">Fixed Interval</label>
      </div>
      <div class="checkbox-row">
        <input type="radio" name="mode" value="all" id="mode-all" />
        <label for="mode-all" style="margin:0;">All Frames</label>
      </div>

      <div id="target-field">
        <label for="target-frames">Target frame count</label>
        <input class="input" type="number" id="target-frames" value="30" min="1" />
      </div>

      <div id="interval-field" class="hidden">
        <label for="interval-sec">Interval (seconds)</label>
        <input class="input" type="number" id="interval-sec" value="1.0" min="0.1" step="0.1" />
      </div>

      <div class="section-label">Trim (optional)</div>
      <div class="field-row">
        <div>
          <label for="start-sec">Start time (seconds)</label>
          <input class="input" type="number" id="start-sec" value="0" min="0" step="0.1" />
        </div>
        <div>
          <label for="end-sec">End time (seconds)</label>
          <input class="input" type="number" id="end-sec" min="0" step="0.1" placeholder="until end of video" />
        </div>
      </div>

      <div class="section-label">Similarity &amp; blur filtering</div>
      <label for="compare-method">Similarity filter method</label>
      <select class="input" id="compare-method">
        <option value="motion_iou" selected>Motion IoU</option>
        <option value="frame_diff">Frame Diff</option>
        <option value="phash">Perceptual Hash</option>
        <option value="none">None</option>
      </select>

      <label for="similarity-threshold">Similarity threshold</label>
      <input class="input" type="number" id="similarity-threshold" value="30.0" step="1" />

      <div class="checkbox-row">
        <input type="checkbox" id="filter-blur" checked />
        <label for="filter-blur" style="margin:0;">Filter blurry frames</label>
      </div>

      <label for="blur-threshold">Blur threshold</label>
      <input class="input" type="number" id="blur-threshold" value="50.0" step="1" />

      <div class="section-label">Output</div>
      <label for="resize-max-px">Output size (optional)</label>
      <select class="input" id="resize-max-px">
        <option value="" selected>Original (no resize)</option>
        <option value="1920">Up to 1920px (long edge)</option>
        <option value="1280">Up to 1280px (long edge)</option>
        <option value="854">Up to 854px (long edge)</option>
        <option value="640">Up to 640px (long edge)</option>
      </select>

      <label for="prefix">Filename prefix</label>
      <input class="input" type="text" id="prefix" placeholder="e.g. surgery01 (optional)" />
      <div style="font-size:12px; color:var(--muted); margin-top:4px;">Saved as: yourname_frame_00001.jpg</div>

      <label for="max-attempts">Max attempts per slot</label>
      <input class="input" type="number" id="max-attempts" value="5" min="1" />

      <div class="checkbox-row">
        <input type="checkbox" id="separate-per-video" checked />
        <label for="separate-per-video" style="margin:0;">Separate folder per video</label>
      </div>

      <div style="margin-top:20px;">
        <button id="extract-start-btn" class="btn-primary">Start Extraction</button>
        <button id="extract-stop-btn" class="btn-stop hidden">Stop</button>
      </div>

      <div id="extract-progress-wrap" class="hidden">
        <div class="progress-bar"><div id="extract-progress-fill" class="progress-bar-fill"></div></div>
        <div id="extract-progress-label" style="font-size:13px; color:var(--muted);"></div>
        <div id="extract-log" class="log-panel"></div>
        <button id="download-zip-btn" class="btn-download hidden" style="margin-top:12px;">Download frames as ZIP</button>
      </div>
    </div>

  </section>

</main>

<script src="/app.js"></script>
</body>
</html>
