<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -46 1020 746" role="img" aria-label="ผังงานการอนุมาน รับเฟรมภาพ คำนวณเกณฑ์ความเชื่อมั่นต่ำสุด เรียกโมเดลทำนาย แล้ววนกรองผลทีละกรอบด้วยเกณฑ์เฉพาะของคลาสนั้น ก่อนแปลงพิกัดกลับเป็นสัดส่วน"><title>ผังงานการอนุมาน</title><style>svg{background:#fbfcfe}text{font-family:"Leelawadee UI","Noto Sans Thai","IBM Plex Sans Thai",Sarabun,Tahoma,sans-serif}.a1s,.a2m,.a3m,.a5m,.a6m,.f1m,.f2m,.f3m{font-family:"Cascadia Mono",Consolas,"SFMono-Regular","Roboto Mono",ui-monospace,monospace}</style><rect x="0" y="0" width="100%" height="100%" fill="#fbfcfe"/>
      <defs>
        <marker id="f3h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0 0 L10 5 L0 10 z" fill="#5c6b7a"/>
        </marker>
      </defs>
      <style>
        .f3p{fill:#ffffff;stroke:#0f3460;stroke-width:1.4}
        .f3d{fill:#eef4fb;stroke:#0f3460;stroke-width:1.4}
        .f3term{fill:#0f3460;stroke:#0f3460;stroke-width:1.4}
        .f3drop{fill:#fff5f6;stroke:#e94560;stroke-width:1.4}
        .f3t{font-size:12px;fill:#1a1a2e}
        .f3w{font-size:12px;fill:#ffffff;font-weight:600}
        .f3m{font-size:10px;fill:#5c6b7a;font-family:'Cascadia Mono',Consolas,monospace}
        .f3y{font-size:10.5px;fill:#2f9e78;font-weight:700}
        .f3n{font-size:10.5px;fill:#e94560;font-weight:700}
        .f3ln{stroke:#5c6b7a;stroke-width:1.4;fill:none}
      </style>

      <rect class="f3term" x="325" y="-40" width="120" height="32" rx="16"/>
      <text class="f3w" x="385" y="-19" text-anchor="middle">เริ่ม</text>
      <line class="f3ln" x1="385" y1="-8" x2="385" y2="10" marker-end="url(#f3h)"/>
      <polygon class="f3p" points="284,14 500,14 486,48 270,48"/>
      <text class="f3t" x="385" y="36" text-anchor="middle">รับเฟรมภาพ · เก็บขนาดเดิม</text>
      <line class="f3ln" x1="385" y1="48" x2="385" y2="68" marker-end="url(#f3h)"/>

      <rect class="f3p" x="245" y="68" width="280" height="44" rx="3"/>
      <text class="f3t" x="385" y="88" text-anchor="middle">หาเกณฑ์ต่ำสุดของทุกคลาส</text>
      <text class="f3m" x="385" y="105" text-anchor="middle">floor = min(conf รวม, conf รายคลาส)</text>
      <line class="f3ln" x1="385" y1="112" x2="385" y2="132" marker-end="url(#f3h)"/>

      <rect class="f3p" x="185" y="132" width="400" height="106" rx="3"/>
      <line x1="199" y1="132" x2="199" y2="238" stroke="#0f3460" stroke-width="1.4"/>
      <line x1="571" y1="132" x2="571" y2="238" stroke="#0f3460" stroke-width="1.4"/>
      <text class="f3t" x="211" y="152">เรียกโมเดลทำนายด้วยเกณฑ์ floor</text>
      <text class="f3m" x="211" y="170">ภายในไลบรารี:</text>
      <text class="f3m" x="211" y="186">ปรับภาพเป็น 640×640 แบบ letterbox แล้ว normalize</text>
      <text class="f3m" x="211" y="202">forward ผ่าน backbone → neck → head</text>
      <text class="f3m" x="211" y="218">ถอดผลจาก P3 P4 P5 แล้วทำ NMS แยกตามคลาส</text>
      <text class="f3m" x="211" y="232">(agnostic_nms=False กรอบต่างคลาสจึงไม่กดทับกัน)</text>
      <line class="f3ln" x1="385" y1="238" x2="385" y2="258" marker-end="url(#f3h)"/>

      <circle cx="150" cy="278" r="13" fill="#ffffff" stroke="#5c6b7a" stroke-width="1.3"/>
      <text class="f3t" x="150" y="282" text-anchor="middle">ก</text>
      <line class="f3ln" x1="163" y1="278" x2="213" y2="278" marker-end="url(#f3h)"/>

      <polygon class="f3d" points="385,258 555,292 385,326 215,292"/>
      <text class="f3t" x="385" y="290" text-anchor="middle">ยังมีกรอบที่ยังไม่ตรวจ</text>
      <text class="f3t" x="385" y="306" text-anchor="middle">เหลืออยู่หรือไม่</text>
      <text class="f3n" x="568" y="286">ไม่</text>
      <path class="f3ln" d="M555 292 H696" marker-end="url(#f3h)"/>
      <polygon class="f3p" points="706,274 992,274 978,310 692,310"/>
      <text class="f3t" x="842" y="297" text-anchor="middle">คืนรายการผลลัพธ์ทั้งหมด</text>
      <line class="f3ln" x1="842" y1="310" x2="842" y2="328" marker-end="url(#f3h)"/>
      <rect class="f3term" x="767" y="330" width="150" height="32" rx="16"/>
      <text class="f3w" x="842" y="351" text-anchor="middle">จบ</text>
      <text class="f3y" x="398" y="344">ใช่</text>
      <line class="f3ln" x1="385" y1="326" x2="385" y2="352" marker-end="url(#f3h)"/>

      <rect class="f3p" x="245" y="352" width="280" height="42" rx="3"/>
      <text class="f3t" x="385" y="372" text-anchor="middle">หาชื่อคลาสจากรหัสคลาส</text>
      <text class="f3m" x="385" y="388" text-anchor="middle">รหัสเกินช่วง ใช้ตัวเลขเป็นชื่อแทน</text>
      <line class="f3ln" x1="385" y1="394" x2="385" y2="414" marker-end="url(#f3h)"/>

      <polygon class="f3d" points="385,414 575,452 385,490 195,452"/>
      <text class="f3t" x="385" y="448" text-anchor="middle">ความเชื่อมั่น ≥ เกณฑ์</text>
      <text class="f3t" x="385" y="464" text-anchor="middle">เฉพาะของคลาสนั้น</text>
      <text class="f3n" x="588" y="446">ไม่</text>
      <path class="f3ln" d="M575 452 H690" marker-end="url(#f3h)"/>
      <rect class="f3drop" x="692" y="432" width="248" height="40" rx="3"/>
      <text class="f3t" x="704" y="450" fill="#a8203a">ทิ้งกรอบนี้</text>
      <text class="f3m" x="704" y="466" fill="#a8203a">ผ่าน floor แต่ไม่ผ่านเกณฑ์ของคลาส</text>
      <line class="f3ln" x1="940" y1="452" x2="965" y2="452"/>
      <circle cx="978" cy="452" r="13" fill="#ffffff" stroke="#5c6b7a" stroke-width="1.3"/>
      <text class="f3t" x="978" y="456" text-anchor="middle">ก</text>

      <text class="f3y" x="398" y="508">ใช่</text>
      <line class="f3ln" x1="385" y1="490" x2="385" y2="516" marker-end="url(#f3h)"/>

      <rect class="f3p" x="215" y="516" width="340" height="46" rx="3"/>
      <text class="f3t" x="385" y="536" text-anchor="middle">แปลงพิกัดมุมเป็นจุดกึ่งกลางและขนาด</text>
      <text class="f3m" x="385" y="553" text-anchor="middle">หารด้วยขนาดภาพเดิม ได้สัดส่วน 0–1</text>
      <line class="f3ln" x1="385" y1="562" x2="385" y2="582" marker-end="url(#f3h)"/>

      <rect class="f3p" x="265" y="582" width="240" height="40" rx="3"/>
      <text class="f3t" x="385" y="607" text-anchor="middle">เพิ่มลงรายการผลลัพธ์</text>
      <line class="f3ln" x1="505" y1="602" x2="540" y2="602"/>
      <circle cx="553" cy="602" r="13" fill="#ffffff" stroke="#5c6b7a" stroke-width="1.3"/>
      <text class="f3t" x="553" y="606" text-anchor="middle">ก</text>

      <rect x="16" y="644" width="988" height="44" rx="4" fill="#fff8ee" stroke="#c97a00" stroke-width="1.3"/>
      <text class="f3t" x="30" y="663" fill="#8a5500">ทำไมต้องขอที่ floor แล้วค่อยกรองเอง: ไลบรารีจะตัดกรอบที่ต่ำกว่าเกณฑ์ทิ้งก่อนที่โปรแกรมจะเห็น</text>
      <text class="f3t" x="30" y="680" fill="#8a5500">ถ้าส่งเกณฑ์รวมไปตรง ๆ คลาสที่ตั้งเกณฑ์ต่ำกว่า เช่น needle จะไม่มีวันได้กรอบคืนมาเลย</text>
    </svg>