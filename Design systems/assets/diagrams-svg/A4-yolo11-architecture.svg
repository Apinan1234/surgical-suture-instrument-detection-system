<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 486" role="img" aria-label="บล็อกไดอะแกรมของ YOLO11 แสดงภาพนำเข้าขนาด 640 คูณ 640 ผ่าน backbone neck และ head สามระดับ แล้วผ่าน NMS ออกมาเป็นกรอบ พร้อมกล่องแสดงฟังก์ชันสูญเสียสามตัวคือ CIoU BCE และ DFL"><title>สถาปัตยกรรม YOLO11 + loss</title><style>svg{background:#fbfcfe}text{font-family:"Leelawadee UI","Noto Sans Thai","IBM Plex Sans Thai",Sarabun,Tahoma,sans-serif}.a1s,.a2m,.a3m,.a5m,.a6m,.f1m,.f2m,.f3m{font-family:"Cascadia Mono",Consolas,"SFMono-Regular","Roboto Mono",ui-monospace,monospace}</style><rect x="0" y="0" width="100%" height="100%" fill="#fbfcfe"/>
      <defs>
        <marker id="a5h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0 0 L10 5 L0 10 z" fill="#5c6b7a"/>
        </marker>
      </defs>
      <style>
        .a5t{font-size:12.5px;fill:#1a1a2e;font-weight:600}
        .a5m{font-size:10.5px;fill:#5c6b7a;font-family:'Cascadia Mono',Consolas,monospace}
        .a5n{font-size:10.5px;fill:#8492a6}
        .a5b{fill:#ffffff;stroke:#9fb0c9;stroke-width:1.3}
        .a5ln{stroke:#5c6b7a;stroke-width:1.4;fill:none}
      </style>

      <rect class="a5b" x="16" y="120" width="118" height="66" rx="3"/>
      <text class="a5t" x="75" y="146" text-anchor="middle">ภาพนำเข้า</text>
      <text class="a5m" x="75" y="164" text-anchor="middle">640×640×3</text>
      <line class="a5ln" x1="136" y1="153" x2="158" y2="153" marker-end="url(#a5h)"/>

      <rect x="162" y="60" width="196" height="186" rx="4" fill="#eef4fb" stroke="#0f3460" stroke-width="1.4"/>
      <text class="a5t" x="260" y="84" text-anchor="middle" fill="#0f3460">Backbone</text>
      <text class="a5n" x="260" y="100" text-anchor="middle">สกัดคุณลักษณะจากหยาบไปละเอียด</text>
      <rect class="a5b" x="176" y="112" width="168" height="28" rx="3"/><text class="a5m" x="186" y="131">Conv (stride 2) ×5</text>
      <rect class="a5b" x="176" y="146" width="168" height="28" rx="3"/><text class="a5m" x="186" y="165">C3k2 block ×4</text>
      <rect class="a5b" x="176" y="180" width="168" height="28" rx="3"/><text class="a5m" x="186" y="199">SPPF</text>
      <rect class="a5b" x="176" y="214" width="168" height="24" rx="3"/><text class="a5m" x="186" y="231">C2PSA (attention)</text>

      <line class="a5ln" x1="360" y1="153" x2="382" y2="153" marker-end="url(#a5h)"/>

      <rect x="386" y="60" width="186" height="186" rx="4" fill="#eef4fb" stroke="#0f3460" stroke-width="1.4"/>
      <text class="a5t" x="479" y="84" text-anchor="middle" fill="#0f3460">Neck</text>
      <text class="a5n" x="479" y="100" text-anchor="middle">รวมคุณลักษณะข้ามระดับ (PAN-FPN)</text>
      <rect class="a5b" x="400" y="112" width="158" height="28" rx="3"/><text class="a5m" x="410" y="131">Upsample + Concat</text>
      <rect class="a5b" x="400" y="146" width="158" height="28" rx="3"/><text class="a5m" x="410" y="165">C3k2 (top-down)</text>
      <rect class="a5b" x="400" y="180" width="158" height="28" rx="3"/><text class="a5m" x="410" y="199">Conv + Concat</text>
      <rect class="a5b" x="400" y="214" width="158" height="24" rx="3"/><text class="a5m" x="410" y="231">C3k2 (bottom-up)</text>

      <line class="a5ln" x1="574" y1="153" x2="596" y2="153" marker-end="url(#a5h)"/>

      <rect x="600" y="60" width="196" height="186" rx="4" fill="#eef4fb" stroke="#0f3460" stroke-width="1.4"/>
      <text class="a5t" x="698" y="84" text-anchor="middle" fill="#0f3460">Head · Detect</text>
      <text class="a5n" x="698" y="100" text-anchor="middle">ทำนายสามความละเอียดพร้อมกัน</text>
      <rect class="a5b" x="614" y="112" width="168" height="30" rx="3"/>
      <text class="a5m" x="624" y="132">P3 · 80×80 — วัตถุเล็ก</text>
      <rect class="a5b" x="614" y="148" width="168" height="30" rx="3"/>
      <text class="a5m" x="624" y="168">P4 · 40×40 — วัตถุกลาง</text>
      <rect class="a5b" x="614" y="184" width="168" height="30" rx="3"/>
      <text class="a5m" x="624" y="204">P5 · 20×20 — วัตถุใหญ่</text>
      <text class="a5n" x="614" y="234">anchor-free · แยกสาขากรอบกับสาขาคลาส</text>

      <line class="a5ln" x1="798" y1="153" x2="820" y2="153" marker-end="url(#a5h)"/>
      <rect class="a5b" x="824" y="98" width="180" height="50" rx="3"/>
      <text class="a5t" x="914" y="120" text-anchor="middle">NMS</text>
      <text class="a5n" x="914" y="138" text-anchor="middle">ตัดกรอบซ้อนที่ซ้ำกัน</text>
      <line class="a5ln" x1="914" y1="150" x2="914" y2="172" marker-end="url(#a5h)"/>
      <rect class="a5b" x="824" y="174" width="180" height="58" rx="3"/>
      <text class="a5t" x="914" y="196" text-anchor="middle">ผลลัพธ์</text>
      <text class="a5n" x="914" y="214" text-anchor="middle">กรอบ + คลาส + ความเชื่อมั่น</text>

      <!-- loss -->
      <rect x="16" y="278" width="988" height="140" rx="4" fill="#f7f9fd" stroke="#dde4ef"/>
      <text class="a5t" x="30" y="302">ฟังก์ชันสูญเสียที่ใช้ฝึก — สามส่วน</text>
      <rect class="a5b" x="30" y="316" width="310" height="86" rx="3"/>
      <text class="a5t" x="42" y="338">box loss — CIoU</text>
      <text class="a5n" x="42" y="356">ความคลาดเคลื่อนของตำแหน่งและขนาดกรอบ</text>
      <text class="a5n" x="42" y="374">คิดทั้งพื้นที่ซ้อน ระยะจุดศูนย์กลาง และอัตราส่วน</text>
      <text class="a5m" x="42" y="392">ค่า val สุดท้าย 1.2356</text>
      <rect class="a5b" x="354" y="316" width="310" height="86" rx="3"/>
      <text class="a5t" x="366" y="338">cls loss — BCE</text>
      <text class="a5n" x="366" y="356">ความถูกต้องของการจำแนกประเภทวัตถุ</text>
      <text class="a5n" x="366" y="374">คิดแยกอิสระทีละคลาส</text>
      <text class="a5m" x="366" y="392">ค่า val สุดท้าย 0.9003</text>
      <rect class="a5b" x="678" y="316" width="310" height="86" rx="3"/>
      <text class="a5t" x="690" y="338">dfl loss — Distribution Focal</text>
      <text class="a5n" x="690" y="356">ทำนายขอบกรอบเป็นการแจกแจงความน่าจะเป็น</text>
      <text class="a5n" x="690" y="374">แทนการทำนายเป็นค่าเดียว ทำให้ขอบคมขึ้น</text>
      <text class="a5m" x="690" y="392">ค่า val สุดท้าย 1.1802</text>

      <rect x="16" y="432" width="988" height="42" rx="3" fill="#fff8ee" stroke="#c97a00" stroke-width="1.3"/>
      <text class="a5n" x="30" y="452" fill="#8a5500" font-weight="700">ข้อควรระวัง: YOLO11 ไม่มี objectness loss</text>
      <text class="a5n" x="30" y="468" fill="#8a5500">objectness เป็นของ YOLOv5 และ v7 ใน YOLOv8 ขึ้นไปถูกแทนด้วย DFL — ถ้ารายงานเขียนว่ามี “Object Loss” ถือว่าผิด</text>

      <text class="a5n" x="16" y="42">YOLO11n · 182 ชั้น · 2,591,595 พารามิเตอร์ · 6.5 GFLOPs — เลือกขนาด n เพราะการ์ดจอมี VRAM 4 GB</text>
    </svg>