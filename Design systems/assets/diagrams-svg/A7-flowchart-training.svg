<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 796" role="img" aria-label="ผังงานการฝึกแบบจำลอง เริ่มจากตรวจหน่วยความจำ สแกน label โหลดน้ำหนักตั้งต้น แล้ววนทีละ epoch ซึ่งภายในวนทีละ batch เพื่อคำนวณค่าสูญเสียและปรับน้ำหนัก จบแต่ละ epoch จะประเมินบนชุด validation และบันทึก best.pt เมื่อดีขึ้น"><title>ผังงานการฝึกโมเดล</title><style>svg{background:#fbfcfe}text{font-family:"Leelawadee UI","Noto Sans Thai","IBM Plex Sans Thai",Sarabun,Tahoma,sans-serif}.a1s,.a2m,.a3m,.a5m,.a6m,.f1m,.f2m,.f3m{font-family:"Cascadia Mono",Consolas,"SFMono-Regular","Roboto Mono",ui-monospace,monospace}</style><rect x="0" y="0" width="100%" height="100%" fill="#fbfcfe"/>
      <defs>
        <marker id="f2h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0 0 L10 5 L0 10 z" fill="#5c6b7a"/>
        </marker>
      </defs>
      <style>
        .f2p{fill:#ffffff;stroke:#0f3460;stroke-width:1.4}
        .f2d{fill:#eef4fb;stroke:#0f3460;stroke-width:1.4}
        .f2term{fill:#0f3460;stroke:#0f3460;stroke-width:1.4}
        .f2stop{fill:#fff5f6;stroke:#e94560;stroke-width:1.4}
        .f2keep{fill:#f2faf6;stroke:#2f9e78;stroke-width:1.4}
        .f2t{font-size:12px;fill:#1a1a2e}
        .f2w{font-size:12px;fill:#ffffff;font-weight:600}
        .f2m{font-size:10px;fill:#5c6b7a;font-family:'Cascadia Mono',Consolas,monospace}
        .f2y{font-size:10.5px;fill:#2f9e78;font-weight:700}
        .f2n{font-size:10.5px;fill:#e94560;font-weight:700}
        .f2ln{stroke:#5c6b7a;stroke-width:1.4;fill:none}
      </style>

      <rect class="f2term" x="300" y="14" width="150" height="32" rx="16"/>
      <text class="f2w" x="375" y="35" text-anchor="middle">เริ่ม</text>
      <line class="f2ln" x1="375" y1="46" x2="375" y2="64" marker-end="url(#f2h)"/>

      <polygon class="f2d" points="375,64 545,98 375,132 205,98"/>
      <text class="f2t" x="375" y="94" text-anchor="middle">หน่วยความจำ commit</text>
      <text class="f2t" x="375" y="110" text-anchor="middle">ว่างเกิน 6 GB หรือไม่</text>
      <text class="f2n" x="558" y="92">ไม่</text>
      <path class="f2ln" d="M545 98 H676" marker-end="url(#f2h)"/>
      <rect class="f2stop" x="678" y="78" width="300" height="40" rx="20"/>
      <text class="f2t" x="690" y="96" fill="#a8203a">หยุดทันที พร้อมบอกให้ปิดโปรแกรมอื่น</text>
      <text class="f2m" x="690" y="112" fill="#a8203a">กันไม่ให้ตายกลางทางด้วย WinError 1455</text>
      <text class="f2y" x="388" y="150">ใช่</text>
      <line class="f2ln" x1="375" y1="132" x2="375" y2="152" marker-end="url(#f2h)"/>

      <rect class="f2p" x="245" y="152" width="260" height="42" rx="3"/>
      <text class="f2t" x="375" y="172" text-anchor="middle">สแกนไฟล์ label แล้วสร้างแคช</text>
      <text class="f2m" x="375" y="188" text-anchor="middle">รายงานจำนวนไฟล์เสียหาย</text>
      <line class="f2ln" x1="375" y1="194" x2="375" y2="214" marker-end="url(#f2h)"/>

      <rect class="f2p" x="245" y="214" width="260" height="42" rx="3"/>
      <text class="f2t" x="375" y="234" text-anchor="middle">โหลดน้ำหนักตั้งต้น yolo11n.pt</text>
      <text class="f2m" x="375" y="250" text-anchor="middle">ย้ายมาได้ 448 จาก 499 ชั้น</text>
      <line class="f2ln" x1="375" y1="256" x2="375" y2="276" marker-end="url(#f2h)"/>

      <rect class="f2p" x="245" y="276" width="260" height="42" rx="3"/>
      <text class="f2t" x="375" y="296" text-anchor="middle">เลือก optimizer อัตโนมัติ</text>
      <text class="f2m" x="375" y="312" text-anchor="middle">AdamW lr=0.000769</text>
      <line class="f2ln" x1="375" y1="318" x2="375" y2="338" marker-end="url(#f2h)"/>

      <!-- epoch loop -->
      <rect x="60" y="338" width="700" height="330" rx="5" fill="none" stroke="#0f3460"
            stroke-width="1.2" stroke-dasharray="6 4"/>
      <text class="f2m" x="72" y="356" fill="#0f3460">วงวนระดับ epoch</text>

      <polygon class="f2d" points="375,364 545,398 375,432 205,398"/>
      <text class="f2t" x="375" y="394" text-anchor="middle">ยังไม่ครบ 150 epoch</text>
      <text class="f2t" x="375" y="410" text-anchor="middle">และยังไม่ถูกสั่งหยุด</text>
      <text class="f2y" x="388" y="450">ใช่</text>
      <line class="f2ln" x1="375" y1="432" x2="375" y2="452" marker-end="url(#f2h)"/>

      <rect x="150" y="452" width="450" height="86" rx="3" fill="#ffffff" stroke="#0f3460" stroke-width="1.4"/>
      <line x1="164" y1="452" x2="164" y2="538" stroke="#0f3460" stroke-width="1.4"/>
      <line x1="586" y1="452" x2="586" y2="538" stroke="#0f3460" stroke-width="1.4"/>
      <text class="f2m" x="178" y="470" fill="#0f3460">วงวนระดับ batch · ทีละ 8 ภาพ</text>
      <text class="f2t" x="178" y="492">augment → forward → คำนวณ box(CIoU) + cls(BCE) + dfl</text>
      <text class="f2t" x="178" y="512">→ backward → ปรับน้ำหนัก → จนครบ 197 batch</text>
      <text class="f2m" x="178" y="530" fill="#5c6b7a">แขนที่ปิด augmentation ข้ามขั้น augment ไปเลย</text>
      <line class="f2ln" x1="375" y1="538" x2="375" y2="558" marker-end="url(#f2h)"/>

      <rect class="f2p" x="245" y="558" width="260" height="42" rx="3"/>
      <text class="f2t" x="375" y="578" text-anchor="middle">ประเมินบนชุด validation</text>
      <text class="f2m" x="375" y="594" text-anchor="middle">400 ภาพ ได้ mAP50 และ mAP50-95</text>
      <line class="f2ln" x1="375" y1="600" x2="375" y2="618" marker-end="url(#f2h)"/>

      <polygon class="f2d" points="375,618 545,644 375,670 205,644"/>
      <text class="f2t" x="375" y="648" text-anchor="middle">ดีกว่าค่าที่ดีที่สุดเดิม</text>
      <text class="f2y" x="558" y="638">ใช่</text>
      <path class="f2ln" d="M545 644 H676" marker-end="url(#f2h)"/>
      <polygon class="f2keep" points="692,624 978,624 964,664 678,664"/>
      <text class="f2t" x="702" y="642" fill="#1d6b51">บันทึกทับ best.pt</text>
      <text class="f2m" x="702" y="658" fill="#1d6b51">last.pt ถูกบันทึกทุก epoch อยู่แล้ว</text>

      <text class="f2n" x="196" y="638">ไม่</text>
      <path class="f2ln" d="M205 644 H100 V398 H203" marker-end="url(#f2h)"/>
      <text class="f2m" x="104" y="520" fill="#5c6b7a">epoch ถัดไป</text>
      <path class="f2ln" d="M828 664 V690 H100 V646" />

      <text class="f2n" x="558" y="392">ไม่</text>
      <path class="f2ln" d="M545 398 H996 V60 H700" marker-end="url(#f2h)"/>
      <rect class="f2term" x="420" y="42" width="278" height="36" rx="18"/>
      <text class="f2w" x="559" y="65" text-anchor="middle">จบ · ส่งคืน best.pt เป็นผลลัพธ์</text>

      <rect x="60" y="704" width="918" height="56" rx="4" fill="#fff8ee" stroke="#c97a00" stroke-width="1.3"/>
      <text class="f2t" x="74" y="724" fill="#8a5500">เงื่อนไขหยุดก่อนกำหนด (patience): ถ้า mAP ไม่ดีขึ้นติดต่อกันครบจำนวน epoch ที่กำหนด ระบบจะหยุดเอง</text>
      <text class="f2t" x="74" y="744" fill="#8a5500">รอบ 50 epoch จบโดยชน epoch สุดท้าย แปลว่ายังไม่ converge จึงต้องเทรนรอบใหม่ที่ยาวกว่า — เป็นที่มาของรอบ 150 epoch</text>
    </svg>