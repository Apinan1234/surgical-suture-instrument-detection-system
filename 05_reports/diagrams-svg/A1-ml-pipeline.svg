<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 646" role="img" aria-label="แผนภาพกระบวนการพัฒนาแบบจำลองแบ่งเป็นสี่ระยะจากบนลงล่าง ได้แก่ การเตรียมข้อมูลจากวิดีโอ การเตรียมชุดข้อมูล การฝึกและประเมินสองแขนเปรียบเทียบ และการนำไปใช้งาน พร้อมลูกศรป้อนกลับจากโมเดลกลับไปยังขั้นกำกับข้อมูล"><title>ภาพรวมกระบวนการพัฒนาแบบจำลอง</title><style>svg{background:#fbfcfe}text{font-family:"Leelawadee UI","Noto Sans Thai","IBM Plex Sans Thai",Sarabun,Tahoma,sans-serif}.a1s,.a2m,.a3m,.a5m,.a6m,.f1m,.f2m,.f3m{font-family:"Cascadia Mono",Consolas,"SFMono-Regular","Roboto Mono",ui-monospace,monospace}</style><rect x="0" y="0" width="100%" height="100%" fill="#fbfcfe"/>
