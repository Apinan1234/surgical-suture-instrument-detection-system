          <text x="652" y="362" font-size="11.5" font-weight="700" font-family="Cascadia Mono, Consolas, monospace" fill="#1a1a2e">dataset_exporter.py</text>
          <text x="652" y="383" font-size="11" fill="#5c6b7a">ส่งออก + แบ่งชุดข้อมูล</text>
        </g>

        <!-- band 4 : storage -->
        <g fill="#ffffff" stroke="#0f3460" stroke-width="1.4">
          <rect x="145" y="466" width="186" height="76" rx="3"/>
          <rect x="352" y="466" width="186" height="76" rx="3"/>
          <rect x="559" y="466" width="186" height="76" rx="3"/>
        </g>
        <g stroke="none" text-anchor="middle">
          <text x="238" y="494" font-size="11.5" font-weight="700" font-family="Cascadia Mono, Consolas, monospace" fill="#1a1a2e">state.json</text>
          <text x="238" y="513" font-size="10.5" fill="#5c6b7a">+ .bak + backups/</text>
          <text x="238" y="530" font-size="10" fill="#586778">ไม่มีฐานข้อมูล</text>
          <text x="445" y="494" font-size="11.5" font-weight="700" font-family="Cascadia Mono, Consolas, monospace" fill="#1a1a2e">data/</text>
          <text x="445" y="513" font-size="10.5" fill="#5c6b7a">videos · frames · exports</text>
          <text x="652" y="494" font-size="11.5" font-weight="700" font-family="Cascadia Mono, Consolas, monospace" fill="#1a1a2e">models/*.pt</text>
          <text x="652" y="513" font-size="10.5" fill="#5c6b7a">ไฟล์น้ำหนักโมเดล</text>
        </g>

        <!-- right column : external -->
        <g fill="#ffffff" stroke="#0f3460" stroke-width="1.4">
          <rect x="790" y="210" width="180" height="68" rx="3"/>
          <rect x="790" y="292" width="180" height="68" rx="3"/>
          <rect x="790" y="374" width="180" height="68" rx="3"/>
        </g>
        <rect x="790" y="456" width="180" height="76" rx="3" fill="#ffffff" stroke="#e94560" stroke-width="1.4" stroke-dasharray="5 3"/>
        <g stroke="none" text-anchor="middle">
          <text x="880" y="238" font-size="12" font-weight="700" fill="#1a1a2e">Tesseract OCR</text>
          <text x="880" y="257" font-size="10.5" fill="#5c6b7a">อ่านข้อความบนภาพ</text>
          <text x="880" y="320" font-size="12" font-weight="700" fill="#1a1a2e">Ultralytics YOLOv11</text>
          <text x="880" y="339" font-size="10.5" fill="#5c6b7a">ประมวลผลบนเครื่อง (CPU)</text>
          <text x="880" y="402" font-size="12" font-weight="700" fill="#1a1a2e">Roboflow Cloud API</text>
          <text x="880" y="421" font-size="10.5" fill="#5c6b7a">ประมวลผลบนคลาวด์</text>
          <text x="880" y="482" font-size="11" font-weight="700" font-family="Cascadia Mono, Consolas, monospace" fill="#e94560">train_roboflow_yolo.py</text>
          <text x="880" y="500" font-size="10.5" fill="#5c6b7a">เทรนโมเดลนอกระบบ</text>
          <text x="880" y="517" font-size="10" fill="#586778">--task detect/segment/pose</text>
        </g>

        <!-- arrows -->
