        <!-- band 3 : core modules -->
        <g fill="#ffffff" stroke="#0f3460" stroke-width="1.4">
          <rect x="145" y="334" width="186" height="76" rx="3"/>
          <rect x="352" y="334" width="186" height="76" rx="3"/>
          <rect x="559" y="334" width="186" height="76" rx="3"/>
        </g>
        <g stroke="none" text-anchor="middle">
          <text x="238" y="362" font-size="11.5" font-weight="700" font-family="Cascadia Mono, Consolas, monospace" fill="#1a1a2e">frame_extractor.py</text>
