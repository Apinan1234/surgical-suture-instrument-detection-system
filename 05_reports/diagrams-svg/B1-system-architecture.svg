<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 592" role="img" aria-label="แผนภาพสถาปัตยกรรมแบบแบ่งชั้น 4 ชั้นของระบบ พร้อมคอลัมน์บริการภายนอกด้านขวา แสดงว่าโปรแกรมเดสก์ท็อปและเว็บแอปใช้โมดูลแกนกลางชุดเดียวกัน"><title>สถาปัตยกรรมระบบ</title><style>svg{background:#fbfcfe}text{font-family:"Leelawadee UI","Noto Sans Thai","IBM Plex Sans Thai",Sarabun,Tahoma,sans-serif}.a1s,.a2m,.a3m,.a5m,.a6m,.f1m,.f2m,.f3m{font-family:"Cascadia Mono",Consolas,"SFMono-Regular","Roboto Mono",ui-monospace,monospace}</style><rect x="0" y="0" width="100%" height="100%" fill="#fbfcfe"/>
      <defs>
        <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0,1 L9,5 L0,9 z" fill="currentColor"/>
        </marker>
        <marker id="a1r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0,1 L9,5 L0,9 z" fill="#e94560"/>
        </marker>
      </defs>
      <g fill="none" stroke="currentColor" stroke-width="1.4">

        <!-- band labels -->
        <g font-family="Cascadia Mono, Consolas, monospace" font-size="10.5" letter-spacing="1.4" fill="#5c6b7a" stroke="none">
          <text x="135" y="33">1 · ชั้นผู้ใช้ (CLIENT)</text>
          <text x="135" y="165">2 · ชั้นแอปพลิเคชัน (APPLICATION)</text>
          <text x="135" y="315">3 · ชั้นโมดูลแกนกลาง (CORE)</text>
          <text x="135" y="447">4 · ชั้นจัดเก็บข้อมูล (STORAGE)</text>
          <text x="775" y="165">ภายนอก / นอกระบบ</text>
        </g>

        <!-- band backgrounds -->
        <g fill="#eef1f7" stroke="#dde4ef" stroke-width="1">
          <rect x="135" y="40"  width="620" height="100" rx="4"/>
          <rect x="135" y="172" width="620" height="118" rx="4"/>
          <rect x="135" y="322" width="620" height="100" rx="4"/>
          <rect x="135" y="454" width="620" height="100" rx="4"/>
          <rect x="775" y="172" width="210" height="382" rx="4"/>
        </g>

        <!-- band 1 : clients -->
        <g fill="#ffffff" stroke="#0f3460" stroke-width="1.4">
          <rect x="145" y="52" width="288" height="76" rx="3"/>
          <rect x="457" y="52" width="288" height="76" rx="3"/>
        </g>
        <g stroke="none" fill="#1a1a2e" text-anchor="middle">
          <text x="289" y="80" font-size="13.5" font-weight="700">โปรแกรมเดสก์ท็อป (เดิม)</text>
          <text x="289" y="101" font-size="11" font-family="Cascadia Mono, Consolas, monospace" fill="#5c6b7a">app.py — Tkinter</text>
          <text x="601" y="80" font-size="13.5" font-weight="700">เว็บแอปพลิเคชัน (ใหม่)</text>
          <text x="601" y="101" font-size="11" font-family="Cascadia Mono, Consolas, monospace" fill="#5c6b7a">index.html · style.css · app.js</text>
          <text x="601" y="118" font-size="10" fill="#586778">ไม่ใช้ framework / ไม่มีขั้นตอน build</text>
