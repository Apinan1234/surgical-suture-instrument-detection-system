        <rect x="145" y="184" width="600" height="94" rx="3" fill="#ffffff" stroke="#0f3460" stroke-width="1.6"/>
        <text x="445" y="207" font-size="13.5" font-weight="700" fill="#1a1a2e" stroke="none" text-anchor="middle">webapp/server.py — FastAPI + Uvicorn</text>
        <g fill="#e7ebf5" stroke="#b9c6dd" stroke-width="1">
