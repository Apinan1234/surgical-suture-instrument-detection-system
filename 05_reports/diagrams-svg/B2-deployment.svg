<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 400" role="img" aria-label="แผนภาพการติดตั้งใช้งานแบบ UML แสดงเครื่องคอมพิวเตอร์ผู้ใช้เครื่องเดียวที่มีเว็บเบราว์เซอร์และ Python Uvicorn รันอยู่ และเชื่อมต่อออกไปยัง Roboflow Cloud ผ่าน HTTPS"><title>การติดตั้งใช้งาน</title><style>svg{background:#fbfcfe}text{font-family:"Leelawadee UI","Noto Sans Thai","IBM Plex Sans Thai",Sarabun,Tahoma,sans-serif}.a1s,.a2m,.a3m,.a5m,.a6m,.f1m,.f2m,.f3m{font-family:"Cascadia Mono",Consolas,"SFMono-Regular","Roboto Mono",ui-monospace,monospace}</style><rect x="0" y="0" width="100%" height="100%" fill="#fbfcfe"/>
      <defs>
        <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0,1 L9,5 L0,9 z" fill="currentColor"/>
        </marker>
      </defs>

      <!-- device 1 : user machine -->
      <g stroke="#0f3460" stroke-width="1.5">
        <polygon points="40,76 54,62 634,62 620,76" fill="#e7ebf5"/>
        <polygon points="620,76 634,62 634,352 620,366" fill="#dce3f0"/>
        <rect x="40" y="76" width="580" height="290" fill="#f4f7fc"/>
      </g>
      <text x="54" y="98" font-size="11" font-family="Cascadia Mono, Consolas, monospace" fill="#5c6b7a">«device»</text>
      <text x="54" y="117" font-size="14" font-weight="700" fill="#1a1a2e">เครื่องคอมพิวเตอร์ของผู้ใช้ — CPU เท่านั้น (ไม่ต้องใช้ GPU)</text>

      <!-- exec env 1 : browser -->
      <g stroke="#0f3460" stroke-width="1.3">
        <polygon points="64,128 74,118 322,118 312,128" fill="#e7ebf5"/>
        <polygon points="312,128 322,118 322,222 312,232" fill="#dce3f0"/>
        <rect x="64" y="128" width="248" height="104" fill="#ffffff"/>
      </g>
      <text x="76" y="147" font-size="10" font-family="Cascadia Mono, Consolas, monospace" fill="#5c6b7a">«executionEnvironment»</text>
      <text x="76" y="165" font-size="12.5" font-weight="700" fill="#1a1a2e">เว็บเบราว์เซอร์</text>
      <rect x="78" y="176" width="220" height="42" fill="#f4f7fc" stroke="#b9c6dd" stroke-width="1"/>
      <text x="86" y="192" font-size="9.5" font-family="Cascadia Mono, Consolas, monospace" fill="#5c6b7a">«artifact»</text>
      <text x="86" y="208" font-size="10.5" font-family="Cascadia Mono, Consolas, monospace" fill="#1a1a2e">index.html · style.css · app.js</text>

      <!-- exec env 2 : python -->
      <g stroke="#0f3460" stroke-width="1.3">
        <polygon points="336,128 346,118 598,118 588,128" fill="#e7ebf5"/>
        <polygon points="588,128 598,118 598,336 588,346" fill="#dce3f0"/>
        <rect x="336" y="128" width="252" height="218" fill="#ffffff"/>
      </g>
      <text x="348" y="147" font-size="10" font-family="Cascadia Mono, Consolas, monospace" fill="#5c6b7a">«executionEnvironment»</text>
      <text x="348" y="165" font-size="12.5" font-weight="700" fill="#1a1a2e">Python 3.11 + Uvicorn</text>
      <g fill="#f4f7fc" stroke="#b9c6dd" stroke-width="1">
        <rect x="350" y="176" width="224" height="30"/>
        <rect x="350" y="212" width="224" height="30"/>
        <rect x="350" y="248" width="224" height="30"/>
        <rect x="350" y="284" width="224" height="30"/>
      </g>
      <g font-family="Cascadia Mono, Consolas, monospace" font-size="10.5" fill="#1a1a2e">
        <text x="360" y="195">server.py (FastAPI)</text>
        <text x="360" y="231">frame_extractor · detector · exporter</text>
        <text x="360" y="267">state.json · state.json.bak</text>
        <text x="360" y="303">data/ · models/</text>
      </g>

      <!-- device 2 : roboflow -->
      <g stroke="#0f3460" stroke-width="1.5">
        <polygon points="780,150 792,138 962,138 950,150" fill="#e7ebf5"/>
        <polygon points="950,150 962,138 962,248 950,260" fill="#dce3f0"/>
        <rect x="780" y="150" width="170" height="110" fill="#f4f7fc"/>
      </g>
      <text x="792" y="172" font-size="11" font-family="Cascadia Mono, Consolas, monospace" fill="#5c6b7a">«device»</text>
      <text x="792" y="192" font-size="13" font-weight="700" fill="#1a1a2e">Roboflow Cloud</text>
      <text x="792" y="212" font-size="10.5" fill="#5c6b7a">บริการภายนอก</text>
      <text x="792" y="230" font-size="10" fill="#586778">(ทางเลือก ไม่บังคับ)</text>

      <!-- connections -->
      <g fill="none" stroke="currentColor" stroke-width="1.4">
        <path d="M188 232 V262 H332" marker-end="url(#a2)"/>
        <path d="M588 200 H778" marker-end="url(#a2)"/>
      </g>
      <text x="256" y="255" font-size="10.5" fill="#5c6b7a" text-anchor="middle" font-family="Cascadia Mono, Consolas, monospace">«HTTP» localhost:8000</text>
      <text x="683" y="192" font-size="10.5" fill="#5c6b7a" text-anchor="middle" font-family="Cascadia Mono, Consolas, monospace">«HTTPS»</text>
      <text x="683" y="220" font-size="10.5" fill="#5c6b7a" text-anchor="middle">ใช้เฉพาะเมื่อเลือก backend = roboflow</text>

      <text x="54" y="392" font-size="11" fill="#5c6b7a">ไม่มี database server · ไม่มี load balancer · ไม่มี message queue · ไม่มี container — ทั้งระบบรันเป็นโปรเซสเดียวบนเครื่องเดียว</text>
    </svg>