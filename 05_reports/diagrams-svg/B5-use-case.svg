        <line x1="130" y1="396" x2="224" y2="514"/>
        <line x1="130" y1="398" x2="224" y2="590"/>
        <line x1="130" y1="400" x2="224" y2="668"/>
      </g>

      <!-- associations : secondary actors -->
      <g stroke="#1a1a2e" stroke-width="1.3" fill="none">
        <line x1="458" y1="288" x2="960" y2="288"/>
        <path d="M458 444 H820 V300 H960"/>
        <line x1="792" y1="580" x2="960" y2="580"/>
