        <text x="680" y="245">ติดตามความคืบหน้างาน</text>
        <text x="680" y="335">กำกับด้วยกรอบสี่เหลี่ยม</text>
        <text x="680" y="415">กำกับด้วยรูปหลายเหลี่ยม</text>
        <text x="680" y="495">กำกับด้วยจุดสำคัญ</text>
        <text x="680" y="578">อ่านข้อความบนภาพ</text>
        <text x="680" y="593" font-size="9.5" fill="#586778">(OCR)</text>
      </g>

      <!-- associations : primary actor -->
