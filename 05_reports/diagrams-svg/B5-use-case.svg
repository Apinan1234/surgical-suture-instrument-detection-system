<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 760" role="img" aria-label="แผนภาพยูสเคสแสดงผู้ใช้งานระบบทางซ้ายเชื่อมกับยูสเคสหลัก 8 รายการ และมีตัวแสดงภายนอกคือ Roboflow Cloud API และ Tesseract OCR ทางขวา"><title>แผนภาพยูสเคส</title><style>svg{background:#fbfcfe}text{font-family:"Leelawadee UI","Noto Sans Thai","IBM Plex Sans Thai",Sarabun,Tahoma,sans-serif}.a1s,.a2m,.a3m,.a5m,.a6m,.f1m,.f2m,.f3m{font-family:"Cascadia Mono",Consolas,"SFMono-Regular","Roboto Mono",ui-monospace,monospace}</style><rect x="0" y="0" width="100%" height="100%" fill="#fbfcfe"/>
      <defs>
        <marker id="uOpen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
          <path d="M0,1 L9,5 L0,9" fill="none" stroke="currentColor" stroke-width="1.2"/>
        </marker>
        <marker id="uTri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse">
          <polygon points="0,0.5 11,6 0,11.5" fill="#fbfcfe" stroke="currentColor" stroke-width="1.2"/>
        </marker>
      </defs>

      <!-- system boundary -->
      <rect x="210" y="52" width="690" height="664" fill="none" stroke="#0f3460" stroke-width="1.8"/>
      <text x="555" y="82" text-anchor="middle" font-size="13" font-weight="700" fill="#0f3460">ระบบตรวจจับเครื่องมือผ่าตัดและบริเวณแผลด้วยปัญญาประดิษฐ์ (เว็บแอปพลิเคชัน)</text>

      <!-- primary actor -->
      <g stroke="#1a1a2e" stroke-width="1.7" fill="none">
