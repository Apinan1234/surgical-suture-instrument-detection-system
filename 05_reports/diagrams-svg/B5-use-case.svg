      <text x="985" y="659" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1a1a2e">Tesseract</text>
      <text x="985" y="675" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1a1a2e">OCR</text>

