      <text x="110" y="484" text-anchor="middle" font-size="10" fill="#5c6b7a">นักวิจัย / ผู้กำกับข้อมูล</text>

      <!-- secondary actors -->
      <g stroke="#1a1a2e" stroke-width="1.5" fill="none">
